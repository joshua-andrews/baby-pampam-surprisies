<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0605">
<title>Our fireplace 🔥</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#070404;color:#fff;font-family:Poppins,sans-serif}
  body.idle{cursor:none}
  #room{position:fixed;inset:0;background:
      radial-gradient(ellipse 70% 55% at 50% 72%, rgba(255,120,40,var(--glow,.22)), transparent 70%),
      radial-gradient(ellipse at 50% 0%, rgba(224,18,47,.18), transparent 60%),
      linear-gradient(#120808,#0a0505 60%,#060303)}
  /* wall pattern */
  #room::before{content:"";position:absolute;inset:0;opacity:.07;
    background-image:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.5) 46px 47px)}
  #floor{position:fixed;left:0;right:0;bottom:0;height:18vh;background:linear-gradient(#2a140c,#140906);
    box-shadow:0 -1px 0 rgba(255,160,90,.15)}
  #floor::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 45% 90% at 50% 0%,rgba(255,130,50,calc(var(--glow,.22)*1.6)),transparent 70%)}
  #rug{position:fixed;left:50%;bottom:3vh;transform:translateX(-50%);width:min(70vw,720px);height:9vh;border-radius:50%;
    background:radial-gradient(ellipse,#7a0f22 0 55%,#5a0a19 56% 62%,#7a0f22 63% 70%,transparent 71%);opacity:.85}
  #rug::after{content:"❤";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scaleY(.55);color:rgba(255,255,255,.18);font-size:5vh}

  /* fireplace */
  #fp{position:fixed;left:50%;bottom:15vh;transform:translateX(-50%);width:min(78vw,760px);aspect-ratio:1.45}
  .stone{position:absolute;inset:0;border-radius:10px 10px 0 0;
    background:
      linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.45)),
      repeating-linear-gradient(0deg,#3b2a26 0 30px,#2a1d1a 30px 33px),
      #3b2a26;
    box-shadow:inset 0 0 60px rgba(0,0,0,.7),0 0 80px rgba(255,110,40,calc(var(--glow,.22)*.8))}
  .stone::before{content:"";position:absolute;inset:0;border-radius:inherit;opacity:.5;
    background:repeating-linear-gradient(90deg,transparent 0 58px,#1d1412 58px 61px);
    -webkit-mask:repeating-linear-gradient(0deg,#000 0 30px,transparent 30px 33px);mask:repeating-linear-gradient(0deg,#000 0 30px,transparent 30px 33px)}
  .mantel{position:absolute;left:-6%;right:-6%;top:-5%;height:7%;border-radius:6px;
    background:linear-gradient(#5b2e1c,#3b1c10);box-shadow:0 8px 20px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,200,150,.18)}
  .opening{position:absolute;left:17%;right:17%;bottom:0;height:68%;border-radius:48% 48% 0 0/38% 38% 0 0;overflow:hidden;
    background:radial-gradient(ellipse at 50% 100%,#2a0f06,#050202 70%);box-shadow:inset 0 0 40px #000,inset 0 -20px 60px rgba(255,90,20,calc(var(--glow,.22)*1.2))}
  #fire{position:absolute;inset:0;width:100%;height:100%}
  .hearth{position:absolute;left:-4%;right:-4%;bottom:-4%;height:5%;border-radius:4px;background:linear-gradient(#4a3530,#271a17)}

  /* things on the mantel */
  .on-mantel{position:absolute;bottom:100%;margin-bottom:0;display:flex;align-items:flex-end}
  .vase{left:2%} .candles{right:3%;gap:10px}
  .title{position:absolute;left:0;right:0;top:-24%;text-align:center;font-family:'Great Vibes',cursive;font-size:clamp(1.6rem,4.2vw,3rem);
    color:#ffe7d0;text-shadow:0 0 18px rgba(255,140,60,.55),0 0 2px rgba(255,255,255,.6);white-space:nowrap}
  .title .amp{color:#ff3b55;padding:0 .2em}
  .candle{width:14px;height:38px;border-radius:3px;background:linear-gradient(90deg,#f4e6d6,#fffaf2,#e6d3bf);position:relative}
  .candle.s{height:26px}
  .candle i{position:absolute;left:50%;bottom:100%;width:8px;height:16px;margin-left:-4px;border-radius:50% 50% 40% 40%/60% 60% 40% 40%;
    background:radial-gradient(ellipse at 50% 75%,#fff 0 20%,#ffd36b 35%,#ff8a1f 70%,transparent 72%);filter:drop-shadow(0 0 8px #ffae42);
    transform-origin:50% 100%;animation:flick 1.3s ease-in-out infinite alternate}
  .candle.s i{animation-duration:1.05s}
  @keyframes flick{0%{transform:scale(1,1) rotate(-2deg)}40%{transform:scale(.92,1.08) rotate(2deg)}100%{transform:scale(1.05,.94) rotate(-1deg)}}
  .vase svg{width:clamp(48px,7vw,80px);height:auto;display:block}

  #embers{position:fixed;inset:0;pointer-events:none}
  #ui{position:fixed;right:16px;top:14px;display:flex;gap:8px;transition:opacity .6s;z-index:5}
  body.idle #ui{opacity:0}
  #ui button{border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;border-radius:99px;padding:8px 12px;font:600 .8rem Poppins,sans-serif;cursor:pointer;backdrop-filter:blur(4px)}
  #ui button.on{background:rgba(224,18,47,.6);border-color:#ff8899}
  #note{position:fixed;left:0;right:0;bottom:4.5vh;text-align:center;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,230,210,.45);transition:opacity 1.2s;z-index:3}
  body.idle #note{opacity:0}
</style>
</head>
<body>
<div id="room"></div>
<div id="floor"></div>
<div id="rug"></div>
<canvas id="embers"></canvas>

<div id="fp">
  <div class="stone"></div>
  <div class="mantel"></div>
  <div class="title">Baby Yoush<span class="amp">&amp;</span>Baby Pampam</div>
  <div class="on-mantel vase" style="top:-5%;transform:translateY(-100%)">
    <svg viewBox="0 0 80 110">
      <g stroke="#3f7a2e" stroke-width="3" fill="none"><path d="M40 70 Q38 45 30 26"/><path d="M40 70 Q44 48 54 34"/><path d="M40 70 Q41 50 41 18"/></g>
      <defs><g id="sf"><g fill="#ffc21a">
        <ellipse cx="0" cy="-9" rx="3.6" ry="7"/><ellipse cx="0" cy="9" rx="3.6" ry="7"/><ellipse cx="-9" cy="0" rx="7" ry="3.6"/><ellipse cx="9" cy="0" rx="7" ry="3.6"/>
        <ellipse cx="-6.5" cy="-6.5" rx="3.4" ry="6.6" transform="rotate(-45 -6.5 -6.5)"/><ellipse cx="6.5" cy="6.5" rx="3.4" ry="6.6" transform="rotate(-45 6.5 6.5)"/>
        <ellipse cx="6.5" cy="-6.5" rx="3.4" ry="6.6" transform="rotate(45 6.5 -6.5)"/><ellipse cx="-6.5" cy="6.5" rx="3.4" ry="6.6" transform="rotate(45 -6.5 6.5)"/></g>
        <circle r="5.2" fill="#6b3a12"/></g></defs>
      <use href="#sf" transform="translate(30 24) scale(.85)"/><use href="#sf" transform="translate(41 16)"/><use href="#sf" transform="translate(55 32) scale(.8)"/>
      <path d="M26 68 h28 l-4 38 a4 4 0 0 1 -4 4 h-12 a4 4 0 0 1 -4 -4z" fill="#b5172b"/><path d="M26 68 h28 v6 h-28z" fill="#e0122f"/>
      <path d="M40 84 c-3-4-9-1-6 4l6 6 6-6c3-5-3-8-6-4z" fill="#fff" opacity=".85"/>
    </svg>
  </div>
  <div class="on-mantel candles" style="top:-5%;transform:translateY(-100%)">
    <div class="candle s"><i></i></div><div class="candle"><i></i></div><div class="candle s"><i></i></div>
  </div>
  <div class="opening"><canvas id="fire"></canvas></div>
  <div class="hearth"></div>
</div>

<div id="note">Te quiero muchísimo 🤍</div>
<div id="ui">
  <button id="crk" title="Crackle sound">🔥 Crackle: off</button>
  <button id="fs" title="Full screen">⛶ Full screen</button>
</div>

<script>
(function(){
  // ---------- fire ----------
  const cv=document.getElementById('fire'), g=cv.getContext('2d');
  let W=0,H=0,dpr=1;
  function fit(){ dpr=Math.min(2,devicePixelRatio||1); const r=cv.getBoundingClientRect(); W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; g.setTransform(dpr,0,0,dpr,0,0); }
  fit(); addEventListener('resize',()=>{ fit(); fitE(); });
  const P=[];
  function spawn(){
    const spread=W*0.30, x=W/2+(Math.random()+Math.random()-1)*spread;
    const edge=Math.abs(x-W/2)/spread;
    P.push({x, y:H*0.84+Math.random()*6, vx:(Math.random()-.5)*14, vy:-(90+Math.random()*120)*(1-edge*0.55),
            r:(22+Math.random()*22)*(1-edge*0.5)*(W/420), life:0, max:1.0+Math.random()*1.0, sway:Math.random()*6.28});
  }
  function logs(){
    const y=H*0.86, w=W*0.62, h=H*0.07;
    g.save(); g.globalCompositeOperation='source-over';
    [[-0.14,-0.08],[0.14,0.09]].forEach(([o,rot])=>{
      g.save(); g.translate(W/2+o*W*0.55,y+h*0.25); g.rotate(rot);
      const lg=g.createLinearGradient(0,-h/2,0,h/2); lg.addColorStop(0,'#5a3320'); lg.addColorStop(1,'#24120a');
      g.fillStyle=lg; g.beginPath(); g.roundRect(-w/2,-h/2,w,h,h/2); g.fill();
      g.fillStyle='#8a5a3a'; g.beginPath(); g.ellipse(w/2-h*0.15,0,h*0.32,h*0.48,0,0,7); g.fill();
      g.fillStyle='rgba(255,120,30,.55)'; g.fillRect(-w/2+h*0.4,h*0.18,w-h,h*0.12);
      g.restore(); });
    g.restore();
  }
  let last=performance.now(), glowT=0;
  function frame(now){
    const dt=Math.min(0.05,(now-last)/1000); last=now;
    g.globalCompositeOperation='source-over'; g.clearRect(0,0,W,H);
    // warm bed of coals
    const bed=g.createRadialGradient(W/2,H*0.9,4,W/2,H*0.9,W*0.42); bed.addColorStop(0,'rgba(255,150,60,.75)'); bed.addColorStop(0.5,'rgba(200,50,10,.35)'); bed.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=bed; g.fillRect(0,0,W,H);
    for(let i=0;i<9;i++) spawn();
    g.globalCompositeOperation='lighter';
    for(let i=P.length-1;i>=0;i--){
      const p=P[i]; p.life+=dt; const k=p.life/p.max; if(k>=1){ P.splice(i,1); continue; }
      p.sway+=dt*3; p.x+=(p.vx+Math.sin(p.sway)*18)*dt; p.y+=p.vy*dt; p.vy-=45*dt; p.vx+=(W/2-p.x)*0.9*dt;
      const r=p.r*(1-k*0.8);
      const c = k<0.18 ? [255,240,190] : k<0.45 ? [255,170,60] : k<0.75 ? [235,80,25] : [140,25,15];
      const a = (k<0.1 ? k*10 : 1-k)*0.42;
      const gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,r); gr.addColorStop(0,`rgba(${c[0]},${c[1]},${c[2]},${a})`); gr.addColorStop(1,'rgba(0,0,0,0)');
      g.fillStyle=gr; g.beginPath(); g.arc(p.x,p.y,r,0,7); g.fill();
    }
    logs();
    // room glow flicker
    glowT+=dt; const glow=0.2+0.05*Math.sin(glowT*7.3)+0.04*Math.sin(glowT*13.1+1)+0.03*(Math.random()-.5);
    document.documentElement.style.setProperty('--glow',glow.toFixed(3));
    drawEmbers(dt);
    requestAnimationFrame(frame);
  }

  // ---------- rising embers (a few tiny hearts) ----------
  const ec=document.getElementById('embers'), eg=ec.getContext('2d'); let EW=0,EH=0;
  function fitE(){ const d=Math.min(2,devicePixelRatio||1); EW=innerWidth; EH=innerHeight; ec.width=EW*d; ec.height=EH*d; eg.setTransform(d,0,0,d,0,0); }
  fitE();
  const E=[];
  function drawEmbers(dt){
    const fr=document.querySelector('.opening').getBoundingClientRect();
    if(Math.random()<0.18) E.push({x:fr.left+fr.width*(0.3+Math.random()*0.4), y:fr.top+fr.height*0.55, vx:(Math.random()-.5)*20, vy:-(30+Math.random()*50), life:0, max:3+Math.random()*3, heart:Math.random()<0.08, s:1+Math.random()*1.8});
    eg.clearRect(0,0,EW,EH);
    for(let i=E.length-1;i>=0;i--){ const e=E[i]; e.life+=dt; if(e.life>e.max){ E.splice(i,1); continue; }
      e.x+=(e.vx+Math.sin(e.life*2+i)*10)*dt; e.y+=e.vy*dt; const a=Math.max(0,1-e.life/e.max);
      if(e.heart){ eg.font=(8+e.s*3)+'px sans-serif'; eg.fillStyle=`rgba(255,80,100,${a*0.8})`; eg.fillText('❤',e.x,e.y); }
      else { eg.fillStyle=`rgba(255,${150+Math.random()*60|0},60,${a})`; eg.beginPath(); eg.arc(e.x,e.y,e.s,0,7); eg.fill(); } }
  }
  requestAnimationFrame(frame);

  // ---------- optional crackle sound (off by default so it doesn't fight the music) ----------
  let ac=null, crkOn=false, crkTimer=null, master=null;
  function crackle(){
    if(!crkOn) return;
    const t=ac.currentTime, n=1+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++){
      const len=0.01+Math.random()*0.03, b=ac.createBuffer(1,ac.sampleRate*len,ac.sampleRate), d=b.getChannelData(0);
      for(let j=0;j<d.length;j++) d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,3);
      const s=ac.createBufferSource(), f=ac.createBiquadFilter(), gn=ac.createGain();
      s.buffer=b; f.type='bandpass'; f.frequency.value=1500+Math.random()*3500; f.Q.value=0.8; gn.gain.value=0.08+Math.random()*0.18;
      s.connect(f); f.connect(gn); gn.connect(master); s.start(t+i*0.03);
    }
    crkTimer=setTimeout(crackle, 60+Math.random()*420);
  }
  function rumble(){ // soft low "whoosh" bed
    const len=2, b=ac.createBuffer(1,ac.sampleRate*len,ac.sampleRate), d=b.getChannelData(0); let l=0;
    for(let j=0;j<d.length;j++){ l=(l+0.02*(Math.random()*2-1))/1.02; d[j]=l*3; }
    const s=ac.createBufferSource(), f=ac.createBiquadFilter(), gn=ac.createGain(); s.buffer=b; s.loop=true; f.type='lowpass'; f.frequency.value=400; gn.gain.value=0.25;
    s.connect(f); f.connect(gn); gn.connect(master); s.start();
  }
  const crk=document.getElementById('crk');
  crk.addEventListener('click',()=>{
    if(!ac){ const AC=window.AudioContext||window.webkitAudioContext; ac=new AC(); master=ac.createGain(); master.gain.value=0.5; master.connect(ac.destination); rumble(); }
    if(ac.state!=='running') ac.resume();
    crkOn=!crkOn; master.gain.setTargetAtTime(crkOn?0.5:0,ac.currentTime,0.3);
    crk.textContent='🔥 Crackle: '+(crkOn?'on':'off'); crk.classList.toggle('on',crkOn);
    clearTimeout(crkTimer); if(crkOn) crackle();
  });

  // ---------- full screen, keep screen awake, hide controls when idle ----------
  document.getElementById('fs').addEventListener('click',()=>{
    const el=document.documentElement;
    if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); } else { document.exitFullscreen(); }
  });
  let lock=null; async function wake(){ try{ if('wakeLock' in navigator) lock=await navigator.wakeLock.request('screen'); }catch(e){} }
  wake(); document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') wake(); });
  let idleT; const poke=()=>{ document.body.classList.remove('idle'); clearTimeout(idleT); idleT=setTimeout(()=>document.body.classList.add('idle'),3500); };
  ['mousemove','pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,poke)); poke();
  addEventListener('keydown',e=>{ if(e.key==='f'||e.key==='F') document.getElementById('fs').click(); });
})();
</script>
</body>
</html>
